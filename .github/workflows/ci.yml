name: Smart Park CI - Tests & Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-ci:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: smartpark_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        env:
          TESTING: '1'
          PYTHONPATH: '.'
          SECRET_KEY: 'smartpark-ci-test-secret-key-minimum-32-chars-long'
          DATABASE_URL: 'postgresql+asyncpg://postgres:root@localhost:5432/smartpark_test_db'
        run: |
          python -m pytest -q

  frontend-ci:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  e2e-ci:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: smartpark_e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Migrate and seed isolated E2E database
        working-directory: ./backend
        env:
          TESTING: '1'
          PYTHONPATH: '.'
          SECRET_KEY: 'smartpark-ci-e2e-secret-key-minimum-32-chars'
          DATABASE_URL: 'postgresql+asyncpg://postgres:root@localhost:5432/smartpark_e2e_db'
        run: |
          alembic upgrade head
          python scripts/seed_e2e.py

      - name: Start FastAPI
        working-directory: ./backend
        env:
          TESTING: '1'
          PYTHONPATH: '.'
          SECRET_KEY: 'smartpark-ci-e2e-secret-key-minimum-32-chars'
          DATABASE_URL: 'postgresql+asyncpg://postgres:root@localhost:5432/smartpark_e2e_db'
        run: nohup uvicorn app.main_runtime:app --host 127.0.0.1 --port 8000 > /tmp/smartpark-api.log 2>&1 &

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install frontend and Chromium
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: ./frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
