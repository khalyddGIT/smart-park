services:
  # Base de Datos PostgreSQL — ÚNICA BD del sistema (local y prod).
  # El volumen postgres_data es lo que da persistencia real entre reinicios.
  postgres:
    image: postgres:16-alpine
    container_name: smartpark_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartpark_db
    ports:
      # Host 5434: el 5432 lo ocupa un PostgreSQL nativo (v18) en esta máquina
      # y cortaba las conexiones. Dentro de la red docker sigue siendo 5432.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartpark_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpark_backend
    environment:
      ENVIRONMENT: development
      # Exclusivamente PostgreSQL: todo el sistema opera sobre Postgres.
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/smartpark_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smartpark_db
      UPLOADS_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpark_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
