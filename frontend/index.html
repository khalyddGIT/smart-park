    <!-- Google Fonts: Outfit, Plus Jakarta Sans, Instrument Serif & JetBrains Mono -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
    <!-- Leaflet Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Mapbox GL JS v3 3D Engine -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet" />
    <script>
      // Suprimir telemetría externa de Mapbox para evitar ERR_BLOCKED_BY_CLIENT con adblockers y navegadores de privacidad
      (function() {
        const origFetch = window.fetch;
        if (origFetch) {
          window.fetch = function(input, init) {
            const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (url && url.includes('events.mapbox.com')) {
              return Promise.resolve(new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
            }
            return origFetch.apply(this, arguments);
          };
        }
        const origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
          this._isMapboxEvents = typeof url === 'string' && url.includes('events.mapbox.com');
          return origOpen.apply(this, arguments);
        };
        const origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function() {
          if (this._isMapboxEvents) {
            Object.defineProperty(this, 'readyState', { value: 4, configurable: true });
            Object.defineProperty(this, 'status', { value: 200, configurable: true });
            Object.defineProperty(this, 'responseText', { value: '{}', configurable: true });
            setTimeout(() => {
              if (typeof this.onreadystatechange === 'function') this.onreadystatechange();
              if (typeof this.onload === 'function') this.onload();
            }, 0);
            return;
          }
          return origSend.apply(this, arguments);
        };
      })();
    </script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>

    <!-- Pre-paint Theme Initializer (Zero-FOUC para Producción) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('smart_park_theme');
          var validThemes = ['light', 'dark', 'midnight', 'high-contrast'];
          var theme = (saved && validThemes.indexOf(saved) !== -1) ? saved : null;
          if (!theme) {
            var isAuto = localStorage.getItem('smart_park_theme_auto_dark') === 'true';
            if (isAuto) {
              var h = new Date().getHours();
              theme = (h >= 19 || h < 6) ? 'dark' : 'light';
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              theme = 'dark';
            } else {
              theme = 'light';
            }
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (theme !== 'light') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased bg-[#F8FAFC] dark:bg-[#0B0F19] text-[#0F172A] dark:text-[#F8FAFC] font-sans selection:bg-emerald-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
