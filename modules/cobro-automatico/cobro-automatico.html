<!-- COBRO AUTOMÁTICO — RF64–RF68 -->
<div class="page-header"><h1><span class="material-symbols-outlined">receipt_long</span> Cobro Automático</h1></div>
<div class="grid-2">
  <div class="card"><div class="card-header"><h3>Liquidación de Tarifa</h3></div><div class="card-body">
    <div class="mb-md">
      <label class="form-label">Vehículo en salida</label>
      <select class="form-control" id="ca-plate" onchange="calcTarifa()">
        <option value="">Seleccionar vehículo...</option>
      </select>
    </div>
    <div id="ca-details" style="display:none">
      <div style="background:var(--color-bg);padding:16px;border-radius:var(--radius);margin-bottom:16px">
        <div class="d-flex justify-between mb-sm"><span class="text-sm">Espacio:</span><span class="text-sm fw-600" id="ca-space">—</span></div>
        <div class="d-flex justify-between mb-sm"><span class="text-sm">Ingreso:</span><span class="text-sm fw-600" id="ca-in">—</span></div>
        <div class="d-flex justify-between mb-sm"><span class="text-sm">Salida actual:</span><span class="text-sm fw-600" id="ca-out">—</span></div>
        <div class="d-flex justify-between mb-sm"><span class="text-sm">Tiempo total:</span><span class="text-sm fw-600" id="ca-time">—</span></div>
        <div class="d-flex justify-between pt-sm" style="border-top:1px dashed var(--color-border);margin-top:8px"><span class="fw-600">Total a Pagar:</span><span class="fw-700" style="color:var(--c3);font-size:1.2rem" id="ca-total">—</span></div>
      </div>
      <div class="d-flex gap-sm">
        <button class="btn btn-primary" style="flex:1" onclick="procesarCobro()"><span class="material-symbols-outlined">payments</span> Procesar Pago</button>
      </div>
    </div>
  </div></div>
  <div class="card"><div class="card-header"><h3>Transacciones Recientes</h3></div><div class="card-body">
    <div class="sp-table-responsive"><table class="sp-table table-cards"><thead><tr><th>Fecha</th><th>Placa</th><th>Concepto</th><th>Monto</th><th>Estado</th></tr></thead><tbody id="ca-txn-tbody"></tbody></table></div>
  </div></div>
</div>
