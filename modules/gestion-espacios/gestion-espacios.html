<!-- GESTIÓN DE ESPACIOS — RF32–RF38 -->
<div class="page-header"><h1><span class="material-symbols-outlined">grid_view</span> <span id="ge-title">Gestión de Espacios</span></h1>
  <div class="page-header-actions" id="ge-actions"></div>
</div>
<div class="grid-2" id="ge-grid">
  <div class="card"><div class="card-header"><h3 id="ge-local-name">Mapa de Espacios</h3></div><div class="card-body">
    <div style="position:relative;">
      <div id="ge-toolbox" style="display:none; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--color-bg); padding: 8px; border-radius: 8px; border: 1px solid var(--color-border-light);">
        <span class="text-sm fw-600" style="margin-right:8px;">Dibujar:</span>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('wall')"><span class="material-symbols-outlined">square</span> Pared/Obstáculo</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('line')"><span class="material-symbols-outlined">horizontal_rule</span> Línea</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('arrow')"><span class="material-symbols-outlined">arrow_downward</span> Flecha</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('text')"><span class="material-symbols-outlined">title</span> Texto</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('tree')"><span class="material-symbols-outlined">nature</span> Árbol / Zona Verde</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('entry')"><span class="material-symbols-outlined">door_open</span> Entrada/Salida</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('crosswalk')"><span class="material-symbols-outlined">view_comfy_alt</span> Zona Peatonal</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('ev')"><span class="material-symbols-outlined">ev_station</span> Cargador EV</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('disabled')"><span class="material-symbols-outlined">accessible</span> Discapacitados</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('moto')"><span class="material-symbols-outlined">two_wheeler</span> Zona Motos</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('cone')"><span class="material-symbols-outlined">warning</span> Cono</button>
        <button class="btn btn-outline btn-sm" onclick="window.addDesignElement('cc')"><span class="material-symbols-outlined">videocam</span> Cámara</button>
        <div style="flex: 1;"></div>
        <div id="draw-tools" style="display:none; align-items:center; gap:8px;">
          <input type="color" id="draw-color" value="#333333" title="Color" style="width:28px;height:28px;padding:0;border-radius:4px;cursor:pointer">
          <input type="range" id="draw-width" min="1" max="20" value="4" style="width:60px;" title="Grosor">
          <button class="btn btn-ghost btn-sm text-danger" onclick="window.clearCanvas()" title="Borrar Todo"><span class="material-symbols-outlined">delete</span></button>
          <button class="btn btn-primary btn-sm" onclick="window.saveCanvasAsBackground()">Aplicar Dibujo</button>
        </div>
        <span class="text-xs text-muted" id="ge-help-text">Arrastra y ajusta tamaño desde el panel lateral</span>
      </div>
      <div class="space-grid" id="ge-space-grid"><!-- JS --></div>
    </div>
    <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap">
      <span class="text-xs"><span style="display:inline-block;width:12px;height:12px;background:var(--st-available-bg);border:1px solid var(--st-available);border-radius:3px;vertical-align:middle"></span> Disponible</span>
      <span class="text-xs"><span style="display:inline-block;width:12px;height:12px;background:var(--st-occupied-bg);border:1px solid var(--st-occupied);border-radius:3px;vertical-align:middle"></span> Ocupado</span>
      <span class="text-xs"><span style="display:inline-block;width:12px;height:12px;background:var(--st-reserved-bg);border:1px solid var(--st-reserved);border-radius:3px;vertical-align:middle"></span> Reservado</span>
      <span class="text-xs"><span style="display:inline-block;width:12px;height:12px;background:var(--st-blocked-bg);border:1px solid var(--st-blocked);border-radius:3px;vertical-align:middle"></span> Bloqueado</span>
    </div>
  </div></div>
  <div class="card"><div class="card-header"><h3>Detalle del Espacio</h3></div><div class="card-body" id="ge-detail"><p class="text-sm text-muted">Selecciona un espacio para ver su detalle.</p></div></div>
</div>
<div class="card mt-lg"><div class="card-header"><h3>Listado de Espacios</h3></div><div class="card-body"><div class="sp-table-responsive"><table class="sp-table table-cards"><thead><tr><th>ID</th><th>Tipo</th><th>Estado</th><th>Reservable</th><th>Placa</th><th>Acciones</th></tr></thead><tbody id="ge-table-body"><!-- JS --></tbody></table></div></div></div>
<!-- Modal agregar espacio -->
<div class="modal-overlay" id="modal-add-space"><div class="modal"><div class="modal-header"><h2>Agregar Espacio</h2><button class="modal-close" onclick="SP_Components.closeModal('modal-add-space')"><span class="material-symbols-outlined">close</span></button></div><div class="modal-body">
  <div class="form-group"><label class="form-label">ID del espacio</label><input type="text" class="form-control" id="new-space-id" placeholder="Ej: A-16"></div>
  <div class="form-group"><label class="form-label">Tipo de vehículo</label><select class="form-control" id="new-space-type"><option>Automóvil</option><option>Camioneta</option><option>Motocicleta</option><option>Bicicleta</option></select></div>
  <div class="form-group"><label class="form-label">Detalles / Descripción</label><textarea class="form-control" id="new-space-details" rows="2" placeholder="Ej: Espacio reservado para gerencia..."></textarea></div>
  <div class="form-check"><input type="checkbox" id="new-space-reservable" checked><label>Reservable</label></div>
</div><div class="modal-footer"><button class="btn btn-ghost" onclick="SP_Components.closeModal('modal-add-space')">Cancelar</button><button class="btn btn-primary" onclick="addNewSpace()">Agregar</button></div></div></div>
