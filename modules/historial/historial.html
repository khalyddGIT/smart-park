<!-- HISTORIAL — RF91–RF95 -->
<div class="page-header">
  <h1><span class="material-symbols-outlined">history</span> Historial de Reservas</h1>
  <button class="btn btn-primary" onclick="exportarHistorial()"><span class="material-symbols-outlined">download</span> Exportar Historial</button>
</div>
<div class="card mb-lg"><div class="card-header"><h3>Filtros de Búsqueda</h3></div><div class="card-body">
  <div class="filter-bar" style="margin:0;padding:0;border:none;background:transparent">
    <input type="text" class="form-control" id="hist-search" placeholder="Buscar placa o código..." style="width:200px" oninput="initHistorial()">
    <input type="date" class="form-control" id="hist-from" style="width:160px" onchange="initHistorial()">
    <input type="date" class="form-control" id="hist-to" style="width:160px" onchange="initHistorial()">
    <select class="form-control" id="hist-state" style="width:150px" onchange="initHistorial()">
      <option value="">Todos los estados</option>
      <option value="completed">Completado</option>
      <option value="cancelled">Cancelado</option>
      <option value="expired">Expirado</option>
    </select>
  </div>
</div></div>
<div class="card"><div class="card-body" style="padding:0">
  <div class="sp-table-responsive"><table class="sp-table table-cards">
    <thead><tr><th>Código</th><th id="th-user-local">Local</th><th>Placa</th><th>Estado</th><th>Ingreso</th><th>Salida</th><th>Total Pagado</th></tr></thead>
    <tbody id="hist-tbody"></tbody>
  </table></div>
</div></div>
