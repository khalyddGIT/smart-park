<!-- VISIÓN ARTIFICIAL — RF50–RF56 -->
<div class="page-header"><h1><span class="material-symbols-outlined">visibility</span> Visión Artificial / ANPR</h1><span class="badge badge-success" id="va-sync">● Sincronizado en tiempo real</span></div>
<div class="grid-2">
  <div class="card"><div class="card-header"><h3>Simulador de Cámara IA</h3></div><div class="card-body">
    <div class="detection-view" id="va-camera"><img src="img/camera-ai.webp" alt="Vista de cámara"><div class="detection-box" style="top:30%;left:20%;width:25%;height:35%"><span class="det-label">Automóvil — 97%</span></div><div class="detection-box" style="top:35%;left:55%;width:20%;height:30%"><span class="det-label">Camioneta — 94%</span></div></div>
    <div class="mt-md d-flex gap-sm"><button class="btn btn-primary" onclick="simulateDetection()"><span class="material-symbols-outlined">play_arrow</span> Simular Detección</button><button class="btn btn-secondary" onclick="resetDetection()"><span class="material-symbols-outlined">refresh</span> Reiniciar</button></div>
  </div></div>
  <div>
    <div class="card mb-md"><div class="card-header"><h3>Validación ANPR</h3></div><div class="card-body" id="va-anpr-panel">
      <div class="mb-md"><div class="text-xs text-muted mb-sm">PLACA DETECTADA</div><div class="plate-display" id="va-detected-plate">ABC-123</div></div>
      <div class="mb-md" id="va-confidence"></div>
      <div id="va-match-result" class="mb-md"></div>
      <div class="d-flex gap-sm"><button class="btn btn-primary" onclick="authorizeEntry()"><span class="material-symbols-outlined">check</span> Autorizar Entrada</button><button class="btn btn-danger" onclick="denyEntry()"><span class="material-symbols-outlined">close</span> Denegar</button></div>
    </div></div>
    <div class="card"><div class="card-header"><h3>Registro sin Reserva</h3></div><div class="card-body">
      <div class="form-group"><label class="form-label">Placa del vehículo</label><input type="text" class="form-control" id="va-manual-plate" placeholder="ABC-123" style="text-transform:uppercase"></div>
      <div class="form-group"><label class="form-label">Tipo</label><select class="form-control" id="va-manual-type"><option>Automóvil</option><option>Camioneta</option><option>Motocicleta</option></select></div>
      <button class="btn btn-accent" onclick="registerNoReservation()"><span class="material-symbols-outlined">add_circle</span> Registrar Ingreso</button>
    </div></div>
  </div>
</div>
<div class="card mt-lg"><div class="card-header"><h3>Detecciones Recientes</h3></div><div class="card-body"><div class="sp-table-responsive"><table class="sp-table table-cards"><thead><tr><th>Hora</th><th>Placa</th><th>Tipo</th><th>Confianza</th><th>Estado</th><th>Reserva</th></tr></thead><tbody id="va-detections-tbody"></tbody></table></div></div></div>
